<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Scroll-Driven 3D Scene — AETumi</title>
<!--
  Scroll-driven 3D (scrub, NOT autoplay).
  The page is tall and scrollable; a single normalized scroll value
  p = 0..1 drives everything:
     - camera dolly (moves in along Z)
     - object rotation
     - a color shift (hue interpolation)
     - background/fog tint
  The canvas is pinned with position:sticky so the 3D stays fixed while
  the document scrolls behind it.

  REDUCED MOTION: when the user prefers reduced motion we do NOT tie the
  scene to scroll. We render one representative static frame (p = 0.5) and
  leave it — the content below is still fully readable.

  Three.js r160 (UMD global build from cdnjs).
-->
<style>
  html, body { margin: 0; background: #05070d; color: #eef1f8;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  /* The scroll track defines how much scrolling maps to p = 0..1. */
  #track { height: 400vh; position: relative; }
  /* Sticky canvas stage: stays put while #track scrolls. */
  #stage { position: sticky; top: 0; height: 100vh; overflow: hidden; }
  canvas { display: block; }

  .caption { position: absolute; left: 0; right: 0; text-align: center;
    pointer-events: none; padding: 0 6vw; }
  .caption h2 { margin: 0; font-size: clamp(1.6rem, 5vw, 3.4rem);
    letter-spacing: -0.02em; text-wrap: balance; }
  .caption p  { margin: .6rem 0 0; color: #9aa3c4; }
  #c1 { top: 12vh; }  #c2 { top: 12vh; }  #c3 { bottom: 12vh; }
  .progress { position: fixed; top: 0; left: 0; height: 3px; background: #7c8bff;
    width: 0%; z-index: 5; }
  .rm-note { position: fixed; bottom: 12px; width: 100%; text-align: center;
    font-size: .78rem; color: #6b73a0; }
</style>
</head>
<body>
  <div class="progress" id="bar"></div>

  <div id="track">
    <div id="stage">
      <div class="caption" id="c1"><h2>Scroll to explore</h2><p>Every pixel of scroll drives the scene.</p></div>
      <div class="caption" id="c2" style="opacity:0"><h2>Camera dollies in</h2><p>Position, rotation and color are one timeline.</p></div>
      <div class="caption" id="c3" style="opacity:0"><h2>Built on Three.js</h2><p>Deterministic scrub — no autoplay.</p></div>
    </div>
  </div>

  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
  <script type="module">
import * as THREE from 'three';

    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const stage = document.getElementById('stage');
    const track = document.getElementById('track');

    // ---- Renderer / scene / camera -----------------------------------------
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    stage.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x05070d);
    scene.fog = new THREE.Fog(0x05070d, 4, 16);

    const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(0, 0, 9);

    // ---- Object -------------------------------------------------------------
    const geo = new THREE.TorusKnotGeometry(1.3, 0.42, 240, 40);
    const material = new THREE.MeshStandardMaterial({ roughness: 0.28, metalness: 0.55 });
    const knot = new THREE.Mesh(geo, material);
    scene.add(knot);

    // Field of small points for a sense of depth/parallax while dollying.
    const starGeo = new THREE.BufferGeometry();
    const N = 600, arr = new Float32Array(N * 3);
    for (let i = 0; i < N; i++) {
      arr[i*3]   = (Math.random() - 0.5) * 24;
      arr[i*3+1] = (Math.random() - 0.5) * 24;
      arr[i*3+2] = (Math.random() - 0.5) * 24 - 4;
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(arr, 3));
    const stars = new THREE.Points(starGeo,
      new THREE.PointsMaterial({ color: 0x8ea2ff, size: 0.05, transparent: true, opacity: 0.7 }));
    scene.add(stars);

    // ---- Lights -------------------------------------------------------------
    scene.add(new THREE.AmbientLight(0x33406a, 1.0));
    const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(3, 4, 5);
    const rim = new THREE.DirectionalLight(0xff6ab0, 1.0); rim.position.set(-4, -2, -3);
    scene.add(key, rim);

    // ---- The single scrub function: p in [0,1] -> full scene state ---------
    const colA = new THREE.Color(0x4f6cff);  // start hue
    const colB = new THREE.Color(0xff5ea8);  // end hue
    const bgA  = new THREE.Color(0x05070d);
    const bgB  = new THREE.Color(0x140a1e);
    const tmp = new THREE.Color();

    function applyScroll(p) {
      p = Math.min(1, Math.max(0, p));
      // Camera dolly: 9 -> 3.4 units back as we scroll.
      camera.position.z = 9 - p * 5.6;
      camera.position.y = Math.sin(p * Math.PI) * 0.6;
      camera.lookAt(0, 0, 0);
      // Object rotation tied directly to scroll (deterministic scrub).
      knot.rotation.y = p * Math.PI * 2.2;
      knot.rotation.x = p * Math.PI * 0.8;
      stars.rotation.y = p * 0.6;
      // Color + background shift.
      material.color.copy(tmp.copy(colA).lerp(colB, p));
      material.emissive.copy(tmp.copy(colA).lerp(colB, p)).multiplyScalar(0.18);
      scene.background.copy(tmp.copy(bgA).lerp(bgB, p));
      scene.fog.color.copy(scene.background);
      // Caption crossfades across the three thirds of the timeline.
      c2.style.opacity = String(Math.max(0, 1 - Math.abs(p - 0.5) * 4));
      c1.style.opacity = String(Math.max(0, 1 - p * 4));
      c3.style.opacity = String(Math.max(0, (p - 0.72) * 4));
      bar.style.width = (p * 100).toFixed(1) + '%';
    }
    const c1 = document.getElementById('c1'), c2 = document.getElementById('c2'),
          c3 = document.getElementById('c3'), bar = document.getElementById('bar');

    // ---- Scroll -> p --------------------------------------------------------
    function scrollProgress() {
      const total = track.offsetHeight - innerHeight;   // scrollable distance
      return total > 0 ? window.scrollY / total : 0;
    }

    // ---- Render strategy ----------------------------------------------------
    if (reduceMotion) {
      // Static, representative frame. No scroll coupling, no rAF churn.
      applyScroll(0.5);
      renderer.render(scene, camera);
      const note = document.createElement('div');
      note.className = 'rm-note';
      note.textContent = 'Reduced-motion: showing a static frame.';
      document.body.appendChild(note);
    } else {
      // Drive rendering from scroll; rAF only coalesces rapid scroll events.
      let queued = false;
      function onScroll() {
        if (queued) return;
        queued = true;
        requestAnimationFrame(() => {
          applyScroll(scrollProgress());
          renderer.render(scene, camera);
          queued = false;
        });
      }
      addEventListener('scroll', onScroll, { passive: true });
      applyScroll(scrollProgress());
      renderer.render(scene, camera);
    }

    // ---- Resize -------------------------------------------------------------
    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      applyScroll(reduceMotion ? 0.5 : scrollProgress());
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
